name: Verify Windows installer
on:
  push:
    branches: [main]
    paths:
      - scripts/Install-WorkflowTools.ps1
      - scripts/Prepare-Paperclip-Windows.mjs
      - .github/workflows/verify-windows-installer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Enable long paths in disposable CI checkout
        shell: powershell
        run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Parse PowerShell and check source integrity without installing
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/Install-WorkflowTools.ps1'),
            [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          . ./scripts/Install-WorkflowTools.ps1 -CheckOnly -InstallRoot (Join-Path $env:RUNNER_TEMP 'workflow-tools')
          Run-Native python @('-I','-c','import sys; print(sys.version)')
          Run-Native python @('-I','-c','import ast,sys; ast.parse(sys.argv[1]); print(1)','import jev_ultrafast; print(jev_ultrafast.__name__)')
          Run-Native python @('-I','-c','import ast,sys; ast.parse(sys.argv[1]); print(1)','import hindsight; print(hindsight.__name__)')
      - name: Verify isolated Paperclip lockfile repair
        shell: powershell
        run: |
          . ./scripts/Install-WorkflowTools.ps1 -CheckOnly -InstallRoot (Join-Path $env:RUNNER_TEMP 'workflow-tools')
          Run-Native npm.cmd @('install','--global','pnpm@9.15.4')
          $output = @(Prepare-Paperclip -Source (Join-Path $PWD 'vendors/paperclip') -Root (Join-Path $env:RUNNER_TEMP 'workflow-tools') -ExpectedTree '7f167a38e898b90855890fc609adf5267d4ea981')
          $runtime = $output[-1]
          if (-not (Test-Path (Join-Path $runtime 'pnpm-lock.yaml'))) { throw 'Repaired lockfile missing' }
          $sharedPackage = Join-Path $runtime 'packages/shared'
          $manifest = Get-Content -LiteralPath (Join-Path $sharedPackage 'package.json') -Raw | ConvertFrom-Json
          if ($manifest.scripts.build -ne 'tsc && node scripts/genuine-copy-cliplab-assets.mjs') { throw 'Windows build command was not applied' }
          Push-Location $sharedPackage
          try {
            Run-Native node @('scripts/genuine-copy-cliplab-assets.mjs')
            foreach ($asset in @('LICENSE','PROVENANCE.md')) {
              if (-not (Test-Path (Join-Path $sharedPackage ('dist/cliplab/' + $asset)))) { throw "Paperclip asset copy failed: $asset" }
            }
          } finally { Pop-Location }
          Run-Native git @('diff','--quiet','HEAD','--','vendors')
      - name: Build AX Linux CLI from Windows
        shell: powershell
        run: |
          ./scripts/Install-WorkflowTools.ps1 -Only ax -InstallRoot (Join-Path $env:RUNNER_TEMP 'workflow-tools')
          $binary = Join-Path $env:RUNNER_TEMP 'workflow-tools/bin/ax-linux-amd64'
          $bytes = [IO.File]::ReadAllBytes($binary)
          if (($bytes[0..3] -join ',') -ne '127,69,76,70') { throw 'AX output is not a Linux ELF binary' }
